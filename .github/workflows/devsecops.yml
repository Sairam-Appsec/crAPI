name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secrets Scan (TruffleHog)
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: "" 

      # 2. SAST (SonarCloud) 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Sairam-Appsec_crAPI
            -Dsonar.organization=sairam-appsec
            -Dsonar.java.binaries=.
            -Dsonar.sources=.
            -Dsonar.c.file.suffixes=-
            -Dsonar.cpp.file.suffixes=-
            -Dsonar.objc.file.suffixes=-

      # 3. SCA (Snyk)
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4. IaC Scan (Checkov)
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true

      # 5. DOCKER BUILD 
      - name: Build Web Image
        run: |
          docker build -t crapi/web:latest -f services/web/Dockerfile services/web/

      # 6. Container Scan (Trivy) 
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/web:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          # --- PHASE 2: DYNAMIC SECURITY TESTING (DAST) ---

      # 6. Spin up crAPI
      - name: Spin up crAPI
        run: |
          cd deploy/docker
          docker compose up -d
          sleep 120 

      # 7. OWASP ZAP (Fixing Permissions with a shell script)
      - name: OWASP ZAP Baseline Scan
        run: |
          # Creating workspace and giving full permissions to avoid 'Permission Denied'
          mkdir -p zap_out
          chmod 777 zap_out
          docker run --rm -v $(pwd)/zap_out:/zap/wrk/:rw --network="host" \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8888 -r zap_report.html || true
          # Moving report to root so upload-artifact can find it easily
          cp zap_out/zap_report.html ./report_html.html || true

      # 8. Schemathesis (Direct check for content)
      - name: Schemathesis API Scan
        run: |
          pip install schemathesis
          echo "Waiting for crAPI services..."
          timeout 180s bash -c 'until curl -s http://localhost:8888/openapi.json; do sleep 5; done'
          schemathesis run http://localhost:8888/openapi.json --checks all > schemathesis_report.json || true

      # 9. Nikto (Native install to avoid docker permission issues)
      - name: Nikto Server Scan
        run: |
          sudo apt-get update && sudo apt-get install -y nikto
          nikto -h http://localhost:8888 -o nikto_report.xml -Format xml || true

      # --- PHASE 3: REPORTING & INTEGRATION ---

      # 11. Unified Reporting: All Scans in One Engagement
      - name: Final Orchestration
        if: always()
        run: |
          # 1. Port clean-up
          cd deploy/docker
          docker compose down || true
          cd ../..

          # 2. Start DefectDojo
          git clone https://github.com/DefectDojo/django-DefectDojo
          cd django-DefectDojo
          docker compose up -d
          
          echo "Waiting 4 mins for dashboard..."
          sleep 240

          # 3. Dynamic Token Fetch & Clean (Removing spaces)
          CONT_NAME=$(docker ps --filter "name=uwsgi" --format "{{.Names}}")
          RAW_TOKEN=$(docker exec $CONT_NAME python3 manage.py shell -c "from rest_framework.authtoken.models import Token; from django.contrib.auth.models import User; user=User.objects.get(username='admin'); token, _ = Token.objects.get_or_create(user=user); print(token.key)")
          CLEAN_TOKEN=$(echo $RAW_TOKEN | tr -d '[:space:]')
          
          cd ..

          # 4. Push All Reports to One Place
          ENGAGEMENT="Unified-Security-Scan"
          
          # ZAP Push
          ZAP_FILE=$(find . -name "report_html.html" | head -n 1)
          if [ -n "$ZAP_FILE" ]; then
            curl -X POST "http://localhost:8080/api/v2/import-scan/" \
            -H "Authorization: Token $CLEAN_TOKEN" \
            -F "active=true" -F "verified=true" \
            -F "scan_type=ZAP Scan" -F "product_name=crAPI" \
            -F "engagement_name=$ENGAGEMENT" -F "file=@$ZAP_FILE"
          fi

          # Nikto Push
          NIKTO_FILE=$(find . -name "nikto_report.xml" | head -n 1)
          if [ -n "$NIKTO_FILE" ]; then
            curl -X POST "http://localhost:8080/api/v2/import-scan/" \
            -H "Authorization: Token $CLEAN_TOKEN" \
            -F "active=true" -F "verified=true" \
            -F "scan_type=Nikto Scan" -F "product_name=crAPI" \
            -F "engagement_name=$ENGAGEMENT" -F "file=@$NIKTO_FILE"
          fi