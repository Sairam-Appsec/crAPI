name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secrets Scan (TruffleHog)
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: "" 

      # 2. SAST (SonarCloud) 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Sairam-Appsec_crAPI
            -Dsonar.organization=sairam-appsec
            -Dsonar.java.binaries=.
            -Dsonar.sources=.
            -Dsonar.c.file.suffixes=-
            -Dsonar.cpp.file.suffixes=-
            -Dsonar.objc.file.suffixes=-

      # 3. SCA (Snyk)
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4. IaC Scan (Checkov)
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true

      # 5. DOCKER BUILD 
      - name: Build Web Image
        run: |
          docker build -t crapi/web:latest -f services/web/Dockerfile services/web/

      # 6. Container Scan (Trivy) 
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/web:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          # --- PHASE 2: DYNAMIC SECURITY TESTING (DAST) ---

      # 6. Spin up crAPI
      - name: Spin up crAPI
        run: |
          cd deploy/docker
          docker compose up -d
          sleep 120 

      # 7. OWASP ZAP (Saving to a specific local path)
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8888'
          fail_action: false
          # Force the report name and location
          report_name: 'zap_report'

      # 8. Schemathesis
      - name: Schemathesis API Scan
        run: |
          pip install schemathesis
          echo "Waiting for crAPI services..."
          timeout 180s bash -c 'until curl -s http://localhost:8888/openapi.json; do sleep 5; done'
          schemathesis run http://localhost:8888/openapi.json --checks all > schemathesis_report.json || true

      # 9. Nikto
      - name: Nikto Server Scan
        run: |
          sudo apt-get update && sudo apt-get install -y nikto
          nikto -h http://localhost:8888 -o nikto_report.xml -Format xml || true

      # 10. Gather and Upload (The "No-Fail" logic)
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Full-Security-Bundle
          # wildcards and specific names
          path: |
            zap_report.html
            report.html
            schemathesis_report.json
            nikto_report.xml
            zap_report* 

      # 11. Shutdown Phase
      - name: Shutdown crAPI
        if: always()
        run: |
          cd deploy/docker
          docker compose down || true