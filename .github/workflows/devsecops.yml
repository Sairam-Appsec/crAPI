name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # START crAPI
      # ==========================================
      - name: Start crAPI
        run: |
          cd deploy/docker
          docker compose up -d
          sleep 120

      # ==========================================
      # CREATE REPORT DIRECTORY
      # ==========================================
      - name: Create reports directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      # ==========================================
      # DEBUG API ENDPOINTS
      # ==========================================
      - name: Debug crAPI Endpoints
        run: |
          curl -I http://localhost:8888 || true
          curl -I http://localhost:8888/swagger-ui || true
          curl -I http://localhost:8888/v2/api-docs || true
          curl -I http://localhost:8888/openapi.json || true

      # ==========================================
      # OWASP ZAP SCAN
      # ==========================================
      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v $(pwd)/reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8888 \
            -J zap.json || true

          echo "==== REPORT FILES ===="
          ls -lah reports

      # ==========================================
      # GENERATE ZAP SARIF
      # ==========================================
      - name: Generate ZAP SARIF
        run: |
          python3 << 'EOF'
          import json
          import os

          results = []

          if os.path.exists("reports/zap.json"):

              with open("reports/zap.json") as f:
                  data = json.load(f)

              try:
                  alerts = data["site"][0]["alerts"]
              except:
                  alerts = []

              for alert in alerts:
                  results.append({
                      "ruleId": str(alert.get("pluginid", "ZAP")),
                      "level": "warning",
                      "message": {
                          "text": alert.get("alert", "ZAP Alert")
                      },
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": "app"
                              }
                          }
                      }]
                  })

          sarif = {
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "OWASP ZAP"
                      }
                  },
                  "results": results
              }]
          }

          with open("reports/zap.sarif", "w") as f:
              json.dump(sarif, f)

          print("ZAP SARIF generated successfully")
          EOF

      # ==========================================
      # INSTALL SCHEMATHESIS
      # ==========================================
      - name: Install Schemathesis
        run: |
          pip install schemathesis

      # ==========================================
      # RUN SCHEMATHESIS
      # ==========================================
      - name: Run Schemathesis
        run: |
          echo "Waiting for crAPI services..."

          timeout 180s bash -c 'until curl -s http://localhost:8888/v2/api-docs; do sleep 5; done'

          schemathesis run http://localhost:8888/v2/api-docs || true

      # ==========================================
      # GENERATE SCHEMATHESIS SARIF
      # ==========================================
      - name: Generate Schemathesis SARIF
        run: |
          python3 << 'EOF'
          import json

          sarif = {
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "Schemathesis"
                      }
                  },
                  "results": [{
                      "ruleId": "SCHEMATHESIS",
                      "level": "note",
                      "message": {
                          "text": "Schemathesis scan completed"
                      },
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": "app"
                              }
                          }
                      }]
                  }]
              }]
          }

          with open("reports/schema.sarif", "w") as f:
              json.dump(sarif, f)

          print("Schemathesis SARIF generated")
          EOF

      # ==========================================
      # INSTALL NIKTO
      # ==========================================
      - name: Install Nikto
        run: |
          sudo apt-get update
          sudo apt-get install -y nikto

      # ==========================================
      # RUN NIKTO
      # ==========================================
      - name: Run Nikto Scan
        run: |
          nikto -h http://localhost:8888 \
            -Format txt \
            -o reports/nikto.txt || true

      # ==========================================
      # GENERATE NIKTO SARIF
      # ==========================================
      - name: Generate Nikto SARIF
        run: |
          python3 << 'EOF'
          import json
          import os

          results = []

          if os.path.exists("reports/nikto.txt"):

              with open("reports/nikto.txt") as f:
                  lines = f.readlines()

              for line in lines:
                  if "+ " in line:
                      results.append({
                          "ruleId": "NIKTO",
                          "level": "warning",
                          "message": {
                              "text": line.strip()
                          },
                          "locations": [{
                              "physicalLocation": {
                                  "artifactLocation": {
                                      "uri": "app"
                                  }
                              }
                          }]
                      })

          sarif = {
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "Nikto"
                      }
                  },
                  "results": results
              }]
          }

          with open("reports/nikto.sarif", "w") as f:
              json.dump(sarif, f)

          print("Nikto SARIF generated")
          EOF

      # ==========================================
      # VERIFY REPORTS
      # ==========================================
      - name: Verify Reports
        run: |
          echo "==== GENERATED FILES ===="
          ls -lah reports

      # ==========================================
      # UPLOAD ZAP SARIF
      # ==========================================
      - name: Upload ZAP SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/zap.sarif
          category: zap

      # ==========================================
      # UPLOAD NIKTO SARIF
      # ==========================================
      - name: Upload Nikto SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/nikto.sarif
          category: nikto

      # ==========================================
      # UPLOAD SCHEMATHESIS SARIF
      # ==========================================
      - name: Upload Schemathesis SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/schema.sarif
          category: schemathesis

      # ==========================================
      # ARCHIVE REPORTS
      # ==========================================
      - name: Archive Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/