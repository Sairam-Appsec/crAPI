name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 1: Secrets Scan (TruffleHog)
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""

      # Step 2: SAST (SonarCloud)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.java.binaries=.

      # Step 3: SCA (Snyk)
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Step 4: IaC Scan (Checkov)
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true

      # Step 5: DOCKER IMAGE BUILD
      - name: Build Docker Images
        run: |
          cd deploy/docker
          docker-compose build
        env:
          DOCKER_BUILDKIT: 1

      # Step 6: TRIVY CONTAINER SCAN (On the fresh images)
      - name: Trivy Scan (Web Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/web:latest'
          scan-type: 'image'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Scan (API Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/api:latest'
          scan-type: 'image'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'