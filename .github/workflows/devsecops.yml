name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # SECRET SCAN
      # =========================
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""

      # =========================
      # SONARCLOUD SAST
      # =========================
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Sairam-Appsec_crAPI
            -Dsonar.organization=sairam-appsec
            -Dsonar.java.binaries=.
            -Dsonar.sources=.
            -Dsonar.c.file.suffixes=-
            -Dsonar.cpp.file.suffixes=-
            -Dsonar.objc.file.suffixes=-

      # =========================
      # SNYK SCA
      # =========================
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # =========================
      # CHECKOV
      # =========================
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true

      # =========================
      # BUILD IMAGE
      # =========================
      - name: Build Web Image
        run: |
          docker build -t crapi/web:latest -f services/web/Dockerfile services/web/

      # =========================
      # TRIVY SCAN
      # =========================
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/web:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # =========================
      # START crAPI
      # =========================
      - name: Spin up crAPI
        run: |
          cd deploy/docker
          docker compose up -d
          sleep 120

      # =========================
      # CREATE REPORT DIRECTORY
      # =========================
      - name: Create Reports Directory
        run: mkdir -p reports

      # =========================
      # ZAP SCAN
      # =========================
      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            -v $(pwd)/reports:/zap/wrk/:rw \
            --network="host" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8888 \
            -J zap.json \
            -r zap_report.html || true

      # =========================
      # CONVERT ZAP TO SARIF
      # =========================
      - name: Install ZAP SARIF Converter
        run: |
          pip install zap2sarif

      - name: Convert ZAP JSON to SARIF
        run: |
          zap2sarif reports/zap.json > reports/zap.sarif

      # =========================
      # SCHEMATHESIS
      # =========================
      - name: Schemathesis API Scan
        run: |
          pip install schemathesis

          echo "Waiting for crAPI services..."

          timeout 180s bash -c 'until curl -s http://localhost:8888/openapi.json; do sleep 5; done'

          schemathesis run \
            http://localhost:8888/openapi.json \
            --junit-xml=reports/schema.xml || true

      # =========================
      # CONVERT SCHEMATHESIS XML TO SARIF
      # =========================
      - name: Convert Schemathesis XML to SARIF
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import json

          tree = ET.parse('reports/schema.xml')
          root = tree.getroot()

          results = []

          for testcase in root.iter('testcase'):
              failure = testcase.find('failure')

              if failure is not None:
                  text = failure.text if failure.text else "Schemathesis Failure"

                  results.append({
                      "ruleId": "SCHEMATHESIS",
                      "level": "error",
                      "message": {
                          "text": text[:300]
                      },
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {
                                  "uri": testcase.attrib.get('classname', 'api')
                              }
                          }
                      }]
                  })

          sarif = {
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "Schemathesis"
                      }
                  },
                  "results": results
              }]
          }

          with open("reports/schema.sarif", "w") as f:
              json.dump(sarif, f)
          EOF

      # =========================
      # NIKTO SCAN
      # =========================
      - name: Nikto Server Scan
        run: |
          sudo apt-get update
          sudo apt-get install -y nikto

          nikto -h http://localhost:8888 \
            -Format xml \
            -o reports/nikto.xml || true

      # =========================
      # CONVERT NIKTO XML TO SARIF
      # =========================
      - name: Convert Nikto XML to SARIF
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import json

          tree = ET.parse('reports/nikto.xml')
          root = tree.getroot()

          results = []

          for item in root.findall(".//item"):

              desc = item.findtext("description", default="Nikto Finding")

              results.append({
                  "ruleId": "NIKTO",
                  "level": "warning",
                  "message": {
                      "text": desc
                  },
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {
                              "uri": "http://localhost:8888"
                          }
                      }
                  }]
              })

          sarif = {
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "Nikto"
                      }
                  },
                  "results": results
              }]
          }

          with open("reports/nikto.sarif", "w") as f:
              json.dump(sarif, f)
          EOF

      # =========================
      # DEBUG REPORTS
      # =========================
      - name: Verify Generated Reports
        if: always()
        run: |
          echo "Listing reports..."
          ls -R reports

      # =========================
      # UPLOAD TO GITHUB SECURITY TAB
      # =========================

      - name: Upload ZAP SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/zap.sarif
          category: zap

      - name: Upload Nikto SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/nikto.sarif
          category: nikto

      - name: Upload Schemathesis SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/schema.sarif
          category: schemathesis

      # =========================
      # ARCHIVE REPORTS
      # =========================
      - name: Archive All Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-devsecops-reports
          path: |
            reports/