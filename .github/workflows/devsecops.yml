name: crAPI-DevSecOps-Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  Security-Scans:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Dashboard upload ki idi main
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Secrets Scan (TruffleHog)
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: "" 

      # 2. SAST (SonarCloud) 
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Sairam-Appsec_crAPI
            -Dsonar.organization=sairam-appsec
            -Dsonar.java.binaries=.
            -Dsonar.sources=.
            -Dsonar.c.file.suffixes=-
            -Dsonar.cpp.file.suffixes=-
            -Dsonar.objc.file.suffixes=-

      # 3. SCA (Snyk)
      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 4. IaC Scan (Checkov)
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true

      # 5. DOCKER BUILD 
      - name: Build Web Image
        run: |
          docker build -t crapi/web:latest -f services/web/Dockerfile services/web/

      # 6. Container Scan (Trivy) 
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'crapi/web:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          # --- PHASE 2: DYNAMIC SECURITY TESTING (DAST) ---

      # 6. Spin up crAPI
      - name: Spin up crAPI
        run: |
          cd deploy/docker
          docker compose up -d
          sleep 120 

      # 7. OWASP ZAP (Fixing Permissions with a shell script)
      - name: OWASP ZAP Baseline Scan
        run: |
          # Creating workspace and giving full permissions to avoid 'Permission Denied'
          mkdir -p zap_out
          chmod 777 zap_out
          docker run --rm -v $(pwd)/zap_out:/zap/wrk/:rw --network="host" \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8888 -r zap_report.html || true
          # Moving report to root so upload-artifact can find it easily
          cp zap_out/zap_report.html ./report_html.html || true

      # 8. Schemathesis (Direct check for content)
      - name: Schemathesis API Scan
        run: |
          pip install schemathesis
          echo "Waiting for crAPI services..."
          timeout 180s bash -c 'until curl -s http://localhost:8888/openapi.json; do sleep 5; done'
          schemathesis run http://localhost:8888/openapi.json --checks all > schemathesis_report.json || true

      # 9. Nikto (Native install to avoid docker permission issues)
      - name: Nikto Server Scan
        run: |
          sudo apt-get update && sudo apt-get install -y nikto
          nikto -h http://localhost:8888 -o nikto_report.xml -Format xml || true

     # --- PHASE 3: REPORTING & DASHBOARD INTEGRATION ---

      # 11. ZAP Baseline Scan (Official Action - Stable & Green)
      - name: ZAP Scan to SARIF
        if: always()
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8888'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: false # Findings unna pipeline green gaane untundhi, idi recording ki perfect.

      # 12. Schemathesis (Version issue dobbichadaniki simplified command)
      - name: Schemathesis Scan
        if: always()
        run: |
          pip install --upgrade schemathesis
          # JUnit XML create chesthunnam, dashboard upload lo errors raavu.
          schemathesis run http://localhost:8888/openapi.json --junit-xml=schemathesis_report.xml || true

      # 13. Upload All Results to GitHub Security Tab
      - name: Final Dashboard Push
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          # Idhi Checkov and ZAP sarif files ni ethukuvelthundi.
          sarif_file: .
          category: dynamic-analysis

      # 14. Archive Artifacts (Downloadable reports for backup)
      - name: Archive All Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-devsecops-reports
          path: |
            *.sarif
            *.xml
            *.html